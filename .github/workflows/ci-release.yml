name: Windows x86-64

on:
  push:
    branches: [x86-64]
    tags: ['v*']
  pull_request:
    branches: [x86-64]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  build:
    name: Build Windows x86-64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - name: Resolve display version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'ctdozlite').version
          if ($version -match '^(\d+)\.(\d+)\.(\d+)-(\d+)$') {
            $display = '{0}{1:D2}{2:D2}-{3}' -f $Matches[1], [int]$Matches[2], [int]$Matches[3], $Matches[4]
          } else {
            $display = $version
          }
          if (-not $display) { throw 'Không xác định được phiên bản.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$display") {
            throw "Tag $env:GITHUB_REF_NAME không khớp phiên bản v$display."
          }
          "version=$display" >> $env:GITHUB_OUTPUT
      - name: Build release executable
        env:
          SCCACHE_GHA_ENABLED: 'true'
          RUSTC_WRAPPER: sccache
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin ctdozlite
      - name: Check version and prepare files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = Resolve-Path 'target/x86_64-pc-windows-msvc/release/ctdozlite.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput version.txt
          if ($process.ExitCode -ne 0 -or (Get-Content version.txt -Raw).Trim() -ne "ZL-vibe v$env:VERSION") {
            throw 'Không xác minh được phiên bản của tệp chạy.'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "ZL-vibe-$env:VERSION-windows-x86-64.exe"
          Copy-Item -LiteralPath $exe -Destination "dist/$name"
          $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii -LiteralPath 'dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-vibe-windows-x86-64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZL-vibe-windows-x86-64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: ZL-vibe ${{ needs.build.outputs.version }}
          files: dist/*
          generate_release_notes: true
